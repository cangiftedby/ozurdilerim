<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esilaaaaa 💗</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #24151d;
      color: white;
      overflow: hidden;
    }

    .card {
      width: calc(100% - 35px);
      max-width: 390px;
      padding: 35px 25px;
      text-align: center;
      border-radius: 24px;
      background: #332029;
      border: 1px solid #714052;
      box-shadow: 0 15px 45px rgba(0,0,0,.3);
    }

    h1 {
      margin: 0 0 25px;
      color: #f5b5c9;
      font-size: 30px;
      line-height: 1.2;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #754256;
      border-radius: 13px;
      background: #21131a;
      color: white;
      outline: none;
      text-align: center;
      font-size: 20px;
      letter-spacing: 5px;
    }

    input:focus {
      border-color: #e8a0ba;
    }

    .button {
      border: 0;
      border-radius: 13px;
      height: 52px;
      padding: 0 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .open {
      width: 100%;
      margin-top: 12px;
      background: #e9a6bc;
      color: #29151e;
    }

    .open:active {
      transform: scale(.98);
    }

    .error {
      height: 20px;
      margin-top: 8px;
      color: #ee91ad;
      font-size: 13px;
    }

    .hidden {
      display: none;
    }

    /* BARIŞMA EKRANI */

    .question {
      color: #f5b5c9;
      font-size: 29px;
      line-height: 1.35;
      margin: 0 0 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: 55px;
    }

    .yes {
      background: #e9a6bc;
      color: #29151e;
    }

    .no {
      background: #54313e;
      color: white;
      border: 1px solid #754256;
      position: relative;
    }

    .gif-container {
      display: none;
      margin-top: 25px;
    }

    .gif-container img {
      width: 100%;
      max-width: 300px;
      border-radius: 16px;
    }

    .love {
      margin-top: 15px;
      color: #f5b5c9;
      font-size: 18px;
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 27px;
      }

      .question {
        font-size: 26px;
      }

      .button {
        padding: 0 18px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- ŞİFRE EKRANI -->
  <div class="card" id="passwordScreen">

    <h1>Esilaaaaa birtanemmm 💗</h1>

    <input
      id="password"
      type="password"
      inputmode="numeric"
      maxlength="6"
      placeholder="Şifre"
      onkeydown="if(event.key === 'Enter') checkPassword()"
    >

    <button class="button open" onclick="checkPassword()">
      Aç 💗
    </button>

    <div class="error" id="error"></div>

  </div>


  <!-- BARIŞMA EKRANI -->
  <div class="card hidden" id="questionScreen">

    <div class="question">
      Özür dilerim yavrum 🥺<br>
      Barışalımmı? 💗
    </div>

    <div class="buttons">

      <button class="button yes" onclick="yesClicked()">
        EVETTTTT 💕
      </button>

      <button
        class="button no"
        id="noButton"
        onmouseenter="moveNoButton()"
        ontouchstart="moveNoButton()"
        onclick="moveNoButton()"
      >
        HAYIR !
      </button>

    </div>

    <div class="gif-container" id="gifContainer">
      <img src="kedi.gif" alt="Kedi">
      <div class="love">
        Biliyordum barışacağımızııı 🥹💗
      </div>
    </div>

  </div>


  <script>

    function checkPassword() {

      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (password === "160826") {

        document
          .getElementById("passwordScreen")
          .classList.add("hidden");

        document
          .getElementById("questionScreen")
          .classList.remove("hidden");

      } else {

        error.textContent = "Şifre yanlış 🥺";
        document.getElementById("password").value = "";

        setTimeout(() => {
          error.textContent = "";
        }, 1500);

      }
    }


    function moveNoButton() {

      const button = document.getElementById("noButton");

      /*
        İlk kaçıştan sonra buton ekran içinde
        rastgele bir yere gider.
      */

      button.style.position = "fixed";

      const padding = 15;

      const maxX =
        window.innerWidth -
        button.offsetWidth -
        padding;

      const maxY =
        window.innerHeight -
        button.offsetHeight -
        padding;

      const x =
        padding +
        Math.random() * Math.max(0, maxX - padding);

      const y =
        padding +
        Math.random() * Math.max(0, maxY - padding);

      button.style.left = x + "px";
      button.style.top = y + "px";
    }


    function yesClicked() {

      const noButton =
        document.getElementById("noButton");

      const gifContainer =
        document.getElementById("gifContainer");

      noButton.style.display = "none";

      gifContainer.style.display = "block";

    }

  </script>

</body>
</html>
