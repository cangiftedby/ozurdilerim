<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dff0df">

  <title>Esila'm 💚</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #26352b;

      background:
        radial-gradient(
          circle at 50% 35%,
          #f7fff7 0%,
          #e8f5e8 45%,
          #d5e9d6 100%
        );
    }


    /* =========================
       ARKA PLAN ŞİİRİ
       ========================= */

    .poem-layer {
      position: fixed;
      inset: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      pointer-events: none;

      overflow: hidden;

      z-index: 0;
    }

    .poem {
      width: min(92%, 520px);

      text-align: center;

      color: rgba(68, 104, 75, 0.27);

      font-family: Georgia, serif;

      font-size: clamp(15px, 4vw, 20px);

      line-height: 2;

      letter-spacing: 0.15px;

      animation:
        poemFloat 16s ease-in-out infinite alternate;

      filter: blur(0.15px);
    }

    @keyframes poemFloat {

      0% {
        transform:
          translate3d(-8px, 18px, 0)
          scale(0.98);

        opacity: 0.45;
      }

      50% {
        opacity: 0.85;
      }

      100% {
        transform:
          translate3d(8px, -18px, 0)
          scale(1.02);

        opacity: 0.6;
      }
    }


    /* =========================
       ANA KART
       ========================= */

    .card {

      position: relative;

      z-index: 2;

      width: calc(100% - 30px);

      max-width: 390px;

      padding: 34px 23px;

      text-align: center;

      background:
        rgba(255, 255, 255, 0.91);

      border:
        1px solid rgba(104, 146, 109, 0.24);

      border-radius: 26px;

      box-shadow:
        0 18px 55px rgba(65, 94, 69, 0.16);

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter: blur(12px);

      animation: cardIn .7s ease;
    }

    @keyframes cardIn {

      from {
        opacity: 0;
        transform: translateY(12px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }


    /* =========================
       BAŞLIK
       ========================= */

    h1 {

      margin: 0 0 24px;

      color: #557d5b;

      font-size: 32px;

      font-weight: 650;

      letter-spacing: -0.5px;
    }


    /* =========================
       ŞİFRE
       ========================= */

    input {

      width: 100%;

      height: 52px;

      border:
        1px solid #b9d3bb;

      border-radius: 14px;

      outline: none;

      background: #f7fbf7;

      color: #304a35;

      text-align: center;

      font-size: 19px;

      letter-spacing: 6px;

      transition: .25s ease;
    }

    input::placeholder {

      color: #9aad9d;

      letter-spacing: 1px;
    }

    input:focus {

      border-color: #769d7b;

      background: #fff;

      box-shadow:
        0 0 0 4px rgba(118, 157, 123, .10);
    }

    .error {

      min-height: 20px;

      margin-top: 9px;

      color: #78947c;

      font-size: 13px;
    }


    /* =========================
       BARIŞMA EKRANI
       ========================= */

    .question {

      color: #557d5b;

      font-size: 28px;

      line-height: 1.45;

      margin-bottom: 30px;

      font-weight: 600;
    }


    .buttons {

      position: relative;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 13px;

      width: 100%;

      height: 56px;
    }


    button {

      height: 52px;

      border: none;

      border-radius: 14px;

      padding: 0 21px;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      font-family: inherit;
    }


    .yes {

      position: relative;

      z-index: 3;

      background: #91b995;

      color: #fff;

      box-shadow:
        0 7px 18px rgba(91, 130, 97, .18);

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .yes:hover {

      background: #82aa87;

      transform: translateY(-2px);
    }


    /* =========================
       KAÇAN HAYIR
       ========================= */

    .no {

      position: relative;

      z-index: 4;

      background: #eef6ee;

      color: #58745d;

      border:
        1px solid #c5dcc7;

      transition:
        left .45s cubic-bezier(.22, .8, .25, 1),
        top .45s cubic-bezier(.22, .8, .25, 1),
        transform .45s ease;
    }


    /* =========================
       GIF
       ========================= */

    .gif-container {

      display: none;

      margin-top: 26px;

      animation: gifIn .7s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes gifIn {

      from {
        opacity: 0;
        transform: translateY(12px) scale(.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .gif-container img {

      display: block;

      width: 100%;

      max-width: 290px;

      max-height: 290px;

      object-fit: contain;

      margin: 0 auto;

      border-radius: 18px;

      box-shadow:
        0 14px 35px rgba(63, 91, 67, .16);
    }

    .love {

      margin-top: 17px;

      color: #557d5b;

      font-size: 18px;

      font-weight: 600;
    }


    .hidden {
      display: none !important;
    }


    /* =========================
       TELEFON
       ========================= */

    @media (max-width: 420px) {

      .card {

        width: calc(100% - 24px);

        padding:
          30px 18px;
      }

      h1 {

        font-size: 29px;

        margin-bottom: 22px;
      }

      .question {

        font-size: 25px;

        margin-bottom: 26px;
      }

      button {

        padding: 0 17px;

        font-size: 14px;
      }

      .poem {

        font-size: 14px;

        line-height: 1.9;

        width: 88%;
      }
    }


    @media (max-height: 650px) {

      .card {

        padding-top: 24px;

        padding-bottom: 24px;
      }

      .poem {

        font-size: 13px;
      }
    }

  </style>
</head>


<body>


  <!--
    ARKA PLAN ŞİİRİ
  -->

  <div class="poem-layer">

    <div class="poem">

      Ellerimde değil artık, aklımda kalan izin,<br>

      Sessizce büyür her gece, saygım ve sevgim<br>

      İçimde büyüyen şeyin adını koymadım<br>

      Lüzum yok bazı şeylere sen anlatmadan anladım<br>

      Adını anmadım ama bilesin sen birtanesin.

    </div>

  </div>


  <!--
    ŞİFRE EKRANI
  -->

  <div
    class="card"
    id="passwordScreen"
  >

    <h1>
      Esila'm 💗
    </h1>

    <input
      id="password"
      type="password"
      inputmode="numeric"
      maxlength="6"
      autocomplete="off"
      placeholder="Şifre"
    >

    <div
      class="error"
      id="error"
    ></div>

  </div>


  <!--
    BARIŞMA EKRANI
  -->

  <div
    class="card hidden"
    id="questionScreen"
  >

    <div class="question">

      Özür dilerim yavrum 🥺<br>

      Barışalımmı?

    </div>


    <div class="buttons">

      <button
        class="yes"
        id="yesButton"
        onclick="yesClicked()"
      >
        EVETTTTT 💚
      </button>


      <button
        class="no"
        id="noButton"
        onmouseenter="moveNoButton()"
        ontouchstart="moveNoButton(event)"
      >
        HAYIR !
      </button>

    </div>


    <div
      class="gif-container"
      id="gifContainer"
    >

      <img
        src="kedi.gif"
        alt="Kedi"
      >

      <div class="love">
        Biliyordum yavrum barışacağımızı.
      </div>

    </div>

  </div>


  <script>

    const password =
      document.getElementById("password");

    const passwordScreen =
      document.getElementById("passwordScreen");

    const questionScreen =
      document.getElementById("questionScreen");

    const error =
      document.getElementById("error");


    /*
      ŞİFRE:
      160826 yazıldığı anda otomatik açılır.
    */

    password.addEventListener(
      "input",
      function () {

        if (this.value === "160826") {

          passwordScreen.classList.add("hidden");

          questionScreen.classList.remove("hidden");

        }

        else if (this.value.length === 6) {

          error.textContent =
            "Şifre yanlış 🥺";

          setTimeout(() => {

            error.textContent = "";

          }, 1400);

        }

      }
    );


    /*
      HAYIR BUTONU
      Kaybolmaz.
      Yumuşak şekilde farklı yerlere gider.
    */

    function moveNoButton(event) {

      if (event) {
        event.preventDefault();
      }

      const button =
        document.getElementById("noButton");


      /*
        İlk kaçıştan sonra
        fixed konuma geçiyoruz.
      */

      if (
        getComputedStyle(button).position !== "fixed"
      ) {

        const rect =
          button.getBoundingClientRect();

        button.style.position = "fixed";

        button.style.left =
          rect.left + "px";

        button.style.top =
          rect.top + "px";
      }


      const margin = 18;


      const maxX =
        window.innerWidth -
        button.offsetWidth -
        margin;


      const maxY =
        window.innerHeight -
        button.offsetHeight -
        margin;


      /*
        Kartın tam üstüne gelmesini
        azaltmak için güvenli bölgeler.
      */

      let x;
      let y;

      const side =
        Math.floor(Math.random() * 4);


      if (side === 0) {

        x =
          margin +
          Math.random() *
          Math.max(1, maxX - margin);

        y =
          margin +
          Math.random() *
          Math.min(
            120,
            Math.max(1, maxY - margin)
          );

      }

      else if (side === 1) {

        x =
          margin +
          Math.random() *
          Math.max(1, maxX - margin);

        y =
          Math.max(
            120,
            maxY -
            Math.random() * 100
          );

      }

      else if (side === 2) {

        x =
          margin +
          Math.random() *
          Math.min(
            110,
            Math.max(1, maxX - margin)
          );

        y =
          margin +
          Math.random() *
          Math.max(1, maxY - margin);

      }

      else {

        x =
          Math.max(
            110,
            maxX -
            Math.random() * 100
          );

        y =
          margin +
          Math.random() *
          Math.max(1, maxY - margin);
      }


      button.style.left =
        Math.max(
          margin,
          Math.min(x, maxX)
        ) + "px";


      button.style.top =
        Math.max(
          margin,
          Math.min(y, maxY)
        ) + "px";


      /*
        Hafif bir hareket hissi.
      */

      button.style.transform =
        `rotate(${(Math.random() * 6 - 3).toFixed(1)}deg)`;
    }


    /*
      EVET
    */

    function yesClicked() {

      const noButton =
        document.getElementById("noButton");

      const gifContainer =
        document.getElementById("gifContainer");


      noButton.style.display =
        "none";


      gifContainer.style.display =
        "block";

    }

  </script>

</body>
</html>
