<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#e2eee2"
    >

    <title>Esila'm</title>


    <style>

        /* ==================================================
           TEMEL
        ================================================== */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100svh;

            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    #fbfdfb 0%,
                    #eef6ee 48%,
                    #dcebdd 100%
                );

            color: #405b45;
        }


        /* ==================================================
           ŞİİR ARKA PLANI
        ================================================== */

        .poem {
            position: fixed;

            inset: 0;

            z-index: 1;

            pointer-events: none;

            overflow: hidden;
        }


        .poem-line {
            position: absolute;

            width: max-content;

            max-width: 46vw;

            color:
                rgba(61, 94, 67, 0.42);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                clamp(12px, 3.6vw, 18px);

            line-height: 1.55;

            letter-spacing: .1px;

            opacity: 0;

            animation-duration: 1.8s;

            animation-timing-function:
                cubic-bezier(.16, .8, .2, 1);

            animation-fill-mode: forwards;
        }


        /* Soldan */

        .from-left {
            left: 4vw;

            text-align: left;

            animation-name:
                poemLeft;
        }


        /* Sağdan */

        .from-right {
            right: 4vw;

            text-align: right;

            animation-name:
                poemRight;
        }


        @keyframes poemLeft {

            from {
                opacity: 0;

                transform:
                    translateX(-100vw);
            }

            to {
                opacity: 1;

                transform:
                    translateX(0);
            }
        }


        @keyframes poemRight {

            from {
                opacity: 0;

                transform:
                    translateX(100vw);
            }

            to {
                opacity: 1;

                transform:
                    translateX(0);
            }
        }


        /*
           Şiirin konumları.

           Orta bölüm özellikle boş bırakılıyor.
           Böylece kart şiiri kapatmıyor.
        */

        .line1 {
            top: 7%;
        }

        .line2 {
            top: 19%;
        }

        .line3 {
            bottom: 27%;
        }

        .line4 {
            bottom: 15%;
        }

        .line5 {
            bottom: 5%;
        }


        /* ==================================================
           ANA KART
        ================================================== */

        .card {
            position: relative;

            z-index: 10;

            width:
                calc(100% - 24px);

            max-width: 390px;

            padding:
                30px 19px;

            text-align: center;

            background:
                rgba(255, 255, 255, .95);

            border:
                1px solid
                rgba(78, 116, 84, .16);

            border-radius: 25px;

            box-shadow:
                0 20px 60px
                rgba(56, 85, 61, .17);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            animation:
                cardIn .65s ease;
        }


        @keyframes cardIn {

            from {
                opacity: 0;

                transform:
                    translateY(12px)
                    scale(.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        .hidden {
            display: none !important;
        }


        /* ==================================================
           KALP
        ================================================== */

        .heart {
            width: 22px;
            height: 22px;

            margin:
                0 auto 4px;

            color: #202820;

            font-size: 19px;

            line-height: 22px;

            animation:
                heartSpin 6s linear infinite,
                heartGlow 3s ease-in-out infinite;
        }


        /*
           Yavaş sürekli dönüş
        */

        @keyframes heartSpin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }
        }


        /*
           Hafif parlama
        */

        @keyframes heartGlow {

            0%,
            100% {
                filter:
                    drop-shadow(
                        0 0 0
                        rgba(32, 40, 32, 0)
                    );

                opacity: .68;
            }

            50% {
                filter:
                    drop-shadow(
                        0 0 6px
                        rgba(32, 40, 32, .30)
                    );

                opacity: 1;
            }
        }


        /* ==================================================
           BAŞLIK
        ================================================== */

        h1 {
            margin:
                0 0 23px;

            color: #527659;

            font-size: 30px;

            line-height: 1.2;

            font-weight: 650;

            letter-spacing: -.5px;
        }


        /* ==================================================
           ŞİFRE
        ================================================== */

        input {
            display: block;

            width: 100%;

            height: 52px;

            padding:
                0 14px;

            border:
                1px solid #bdd3bf;

            border-radius: 14px;

            outline: none;

            background:
                #f8fbf8;

            color:
                #38543d;

            text-align: center;

            font-size: 19px;

            letter-spacing: 6px;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }


        input::placeholder {
            color:
                #a6b7a8;

            letter-spacing: 1px;
        }


        input:focus {
            border-color:
                #7fa786;

            background:
                #ffffff;

            box-shadow:
                0 0 0 4px
                rgba(127, 167, 134, .11);
        }


        .error {
            min-height: 18px;

            margin-top: 8px;

            color:
                #718f76;

            font-size: 13px;
        }


        /* ==================================================
           BARIŞMA SORUSU
        ================================================== */

        .question {
            margin:
                0 0 28px;

            color:
                #527659;

            font-size:
                clamp(24px, 7vw, 28px);

            line-height:
                1.45;

            font-weight:
                600;
        }


        /* ==================================================
           BUTON ALANI
        ================================================== */

        .buttons {
            position: relative;

            width: 100%;

            height: 54px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 13px;
        }


        button {
            height: 50px;

            padding:
                0 19px;

            border: none;

            border-radius: 14px;

            font-family: inherit;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            touch-action: manipulation;
        }


        /* ==================================================
           EVET
        ================================================== */

        .yes {
            position: relative;

            z-index: 20;

            background:
                #8fb793;

            color:
                white;

            box-shadow:
                0 8px 20px
                rgba(75, 113, 81, .16);

            transition:
                transform .2s ease,
                background .2s ease;
        }


        .yes:hover {
            background:
                #80a985;

            transform:
                translateY(-2px);
        }


        .yes:active {
            transform:
                scale(.96);
        }


        /* ==================================================
           HAYIR
        ================================================== */

        .no {
            position: relative;

            z-index: 30;

            background:
                #eef5ee;

            color:
                #58745d;

            border:
                1px solid
                #c2d7c4;

            transition:
                left .55s
                    cubic-bezier(.22,.8,.2,1),

                top .55s
                    cubic-bezier(.22,.8,.2,1),

                transform .55s
                    cubic-bezier(.22,.8,.2,1);
        }


        /* ==================================================
           GIF
        ================================================== */

        .gif-container {
            display: none;

            margin-top: 25px;

            animation:
                gifIn .7s
                cubic-bezier(.2,.8,.2,1);
        }


        .gif-container img {
            display: block;

            width: 100%;

            max-width: 290px;

            max-height: 290px;

            margin:
                0 auto;

            object-fit: contain;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(59, 89, 64, .17);
        }


        .love {
            margin-top: 16px;

            color:
                #527659;

            font-size: 18px;

            font-weight: 600;
        }


        @keyframes gifIn {

            from {
                opacity: 0;

                transform:
                    translateY(12px)
                    scale(.94);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* ==================================================
           TELEFON
        ================================================== */

        @media (max-width: 420px) {

            .card {
                width:
                    calc(100% - 22px);

                padding:
                    29px 18px;
            }


            h1 {
                font-size: 28px;
            }


            .question {
                font-size: 25px;
            }


            button {
                padding:
                    0 17px;

                font-size: 13px;
            }


            .poem-line {
                max-width: 43vw;

                font-size: 12px;

                line-height: 1.55;
            }
        }


        /* Çok küçük telefon */

        @media (max-width: 350px) {

            .card {
                padding:
                    26px 16px;
            }


            .poem-line {
                max-width: 42vw;

                font-size: 11px;
            }


            .question {
                font-size: 23px;
            }


            button {
                padding:
                    0 15px;

                font-size: 12px;
            }
        }


        /*
           Kısa telefon ekranları
        */

        @media (max-height: 680px) {

            .card {
                padding-top:
                    24px;

                padding-bottom:
                    24px;
            }


            .poem-line {
                font-size: 11px;
            }


            .line1 {
                top: 5%;
            }


            .line2 {
                top: 16%;
            }


            .line3 {
                bottom: 25%;
            }


            .line4 {
                bottom: 13%;
            }


            .line5 {
                bottom: 3%;
            }
        }

    </style>
</head>


<body>


<!-- =====================================================
     ŞİİR
===================================================== -->

<div class="poem">

    <div
        class="poem-line from-left line1"
        style="animation-delay: .15s"
    >
        Ellerimde değil artık,<br>
        aklımda kalan izin,
    </div>


    <div
        class="poem-line from-right line2"
        style="animation-delay: .65s"
    >
        Sessizce büyür her gece,<br>
        saygım ve sevgim
    </div>


    <div
        class="poem-line from-left line3"
        style="animation-delay: 1.15s"
    >
        İçimde büyüyen şeyin<br>
        adını koymadım
    </div>


    <div
        class="poem-line from-right line4"
        style="animation-delay: 1.65s"
    >
        Lüzum yok bazı şeylere,<br>
        sen anlatmadan anladım
    </div>


    <div
        class="poem-line from-left line5"
        style="animation-delay: 2.15s"
    >
        Adını anmadım ama<br>
        bilesin sen birtanesin.
    </div>

</div>



<!-- =====================================================
     ŞİFRE EKRANI
===================================================== -->

<div
    class="card"
    id="passwordScreen"
>

    <div class="heart">
        ♥
    </div>


    <h1>
        Esila'm
    </h1>


    <input
        id="password"
        type="password"
        inputmode="numeric"
        maxlength="6"
        autocomplete="off"
        placeholder="Şifre"
        aria-label="Şifre"
    >


    <div
        class="error"
        id="error"
    ></div>

</div>



<!-- =====================================================
     BARIŞMA EKRANI
===================================================== -->

<div
    class="card hidden"
    id="questionScreen"
>

    <div class="question">

        Özür dilerim yavrum 🥺<br>

        Barışalımmı?

    </div>


    <div
        class="buttons"
        id="buttonArea"
    >

        <button
            class="yes"
            id="yesButton"
            type="button"
        >
            EVETTTTT 💚
        </button>


        <button
            class="no"
            id="noButton"
            type="button"
        >
            HAYIR !
        </button>

    </div>


    <div
        class="gif-container"
        id="gifContainer"
    >

        <img
            src="kedi.gif"
            alt="Kedi"
        >


        <div class="love">
            Biliyordum yavrum barışacağımızı.
        </div>

    </div>

</div>



<script>


/* =====================================================
   ELEMENTLER
===================================================== */

const password =
    document.getElementById("password");

const passwordScreen =
    document.getElementById("passwordScreen");

const questionScreen =
    document.getElementById("questionScreen");

const error =
    document.getElementById("error");

const noButton =
    document.getElementById("noButton");

const yesButton =
    document.getElementById("yesButton");

const buttonArea =
    document.getElementById("buttonArea");



/* =====================================================
   ŞİFRE
===================================================== */

password.addEventListener(
    "input",
    function () {

        /*
           Doğru şifre:
           anında geç.
        */

        if (this.value === "160826") {

            error.textContent = "";

            passwordScreen
                .classList
                .add("hidden");

            questionScreen
                .classList
                .remove("hidden");

            return;
        }


        /*
           6 hane dolduysa yanlış.
        */

        if (this.value.length === 6) {

            error.textContent =
                "Şifre yanlış 🥺";

            setTimeout(() => {

                error.textContent = "";

                password.value = "";

            }, 1000);
        }

    }
);



/* =====================================================
   HAYIR BUTONU
===================================================== */

let escaped = false;


/*
   Butonun kartın üstüne gelmesini önlemek için
   güvenli alanlar hesaplanıyor.
*/

function getSafePosition() {

    const buttonWidth =
        noButton.offsetWidth;

    const buttonHeight =
        noButton.offsetHeight;


    const padding = 16;


    const maxX =
        window.innerWidth -
        buttonWidth -
        padding;


    const maxY =
        window.innerHeight -
        buttonHeight -
        padding;


    /*
       Kartın ekran üzerindeki konumu.
    */

    const card =
        questionScreen.getBoundingClientRect();


    /*
       Kart çevresinde güvenli boşluk.
    */

    const safeGap = 25;


    const forbiddenLeft =
        card.left - buttonWidth - safeGap;

    const forbiddenRight =
        card.right + safeGap;

    const forbiddenTop =
        card.top - buttonHeight - safeGap;

    const forbiddenBottom =
        card.bottom + safeGap;


    /*
       Ekranın dört kenar bölgesinden
       birini seçiyoruz.
    */

    const areas = [];


    /*
       SOL
    */

    if (forbiddenLeft > padding) {

        areas.push("left");
    }


    /*
       SAĞ
    */

    if (
        forbiddenRight <
        window.innerWidth - padding
    ) {

        areas.push("right");
    }


    /*
       ÜST
    */

    if (forbiddenTop > padding) {

        areas.push("top");
    }


    /*
       ALT
    */

    if (
        forbiddenBottom <
        window.innerHeight - padding
    ) {

        areas.push("bottom");
    }


    /*
       Uygun alan bulunamazsa,
       ekranın güvenli sınırları içinde
       herhangi bir yer.
    */

    if (areas.length === 0) {

        return {

            x:
                padding +
                Math.random() *
                Math.max(
                    1,
                    maxX - padding
                ),

            y:
                padding +
                Math.random() *
                Math.max(
                    1,
                    maxY - padding
                )
        };
    }


    const selected =
        areas[
            Math.floor(
                Math.random() *
                areas.length
            )
        ];


    let x;
    let y;


    /* SOL */

    if (selected === "left") {

        x =
            padding +
            Math.random() *
            Math.max(
                1,
                forbiddenLeft - padding
            );

        y =
            padding +
            Math.random() *
            Math.max(
                1,
                maxY - padding
            );
    }


    /* SAĞ */

    else if (selected === "right") {

        x =
            forbiddenRight +
            Math.random() *
            Math.max(
                1,
                maxX - forbiddenRight
            );

        y =
            padding +
            Math.random() *
            Math.max(
                1,
                maxY - padding
            );
    }


    /* ÜST */

    else if (selected === "top") {

        x =
            padding +
            Math.random() *
            Math.max(
                1,
                maxX - padding
            );

        y =
            padding +
            Math.random() *
            Math.max(
                1,
                forbiddenTop - padding
            );
    }


    /* ALT */

    else {

        x =
            padding +
            Math.random() *
            Math.max(
                1,
                maxX - padding
            );

        y =
            forbiddenBottom +
            Math.random() *
            Math.max(
                1,
                maxY - forbiddenBottom
            );
    }


    /*
       Son güvenlik kontrolü.
    */

    x =
        Math.max(
            padding,
            Math.min(
                x,
                maxX
            )
        );


    y =
        Math.max(
            padding,
            Math.min(
                y,
                maxY
            )
        );


    return {
        x,
        y
    };
}



/*
   Butonu hareket ettir.
*/

function moveNoButton() {

    const position =
        getSafePosition();


    noButton.style.left =
        position.x + "px";


    noButton.style.top =
        position.y + "px";


    /*
       Hafif eğim.
       Sert değil.
    */

    const rotation =
        Math.random() * 4 - 2;


    noButton.style.transform =
        `rotate(${rotation}deg)`;
}



/*
   İlk kaçış.

   Mevcut yerini önce fixed olarak
   koruyoruz. Böylece bir anda
   "yol olup" kaybolmuyor.
*/

function escapeNoButton(event) {

    if (event) {
        event.preventDefault();
    }


    if (!escaped) {

        const rect =
            noButton.getBoundingClientRect();


        noButton.style.position =
            "fixed";


        noButton.style.left =
            rect.left + "px";


        noButton.style.top =
            rect.top + "px";


        escaped = true;


        /*
           Browser önce mevcut konumu
           çizsin, sonra hareket etsin.
        */

        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                moveNoButton();

            });

        });

    }

    else {

        moveNoButton();

    }
}



/* =====================================================
   MASAÜSTÜ
===================================================== */

noButton.addEventListener(
    "mouseenter",
    function () {

        escapeNoButton();

    }
);



/* =====================================================
   TELEFON
===================================================== */

noButton.addEventListener(
    "touchstart",
    function (event) {

        escapeNoButton(event);

    },
    {
        passive: false
    }
);



/* =====================================================
   EVET
===================================================== */

yesButton.addEventListener(
    "click",
    function () {

        /*
           Hayır artık görünmez.
        */

        noButton.style.display =
            "none";


        /*
           GIF açılır.
        */

        document
            .getElementById("gifContainer")
            .style.display =
            "block";

    }
);



/* =====================================================
   EKRAN BOYUTU DEĞİŞİRSE
===================================================== */

window.addEventListener(
    "resize",
    function () {

        if (!escaped) {
            return;
        }


        const width =
            noButton.offsetWidth;

        const height =
            noButton.offsetHeight;


        const padding = 16;


        const maxX =
            window.innerWidth -
            width -
            padding;


        const maxY =
            window.innerHeight -
            height -
            padding;


        let x =
            parseFloat(
                noButton.style.left
            );


        let y =
            parseFloat(
                noButton.style.top
            );


        if (Number.isNaN(x)) {
            x = padding;
        }


        if (Number.isNaN(y)) {
            y = padding;
        }


        x =
            Math.max(
                padding,
                Math.min(
                    x,
                    maxX
                )
            );


        y =
            Math.max(
                padding,
                Math.min(
                    y,
                    maxY
                )
            );


        noButton.style.left =
            x + "px";


        noButton.style.top =
            y + "px";
    }
);

</script>

</body>
</html>
