<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dcebdc">

<title>Esila'm 💚</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    min-height: 100svh;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    background:
        radial-gradient(circle at 50% 45%, #f8fcf7 0%, #e8f2e7 48%, #d5e6d5 100%);

    color: #334b38;
}


/* =========================================
   ŞİİR
   Her dize ayrı ayrı sağdan / soldan gelir
   ========================================= */

.poem {
    position: fixed;
    inset: 0;

    z-index: 0;
    pointer-events: none;

    display: flex;
    flex-direction: column;
    justify-content: center;

    gap: 17px;

    overflow: hidden;

    padding: 20px 0;
}

.line {
    width: max-content;
    max-width: 92%;

    color: rgba(60, 91, 66, 0.31);

    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(14px, 4vw, 19px);
    line-height: 1.5;

    white-space: nowrap;

    opacity: 0;

    animation-duration: 1.7s;
    animation-timing-function: cubic-bezier(.22, .75, .2, 1);
    animation-fill-mode: forwards;
}


/* Sağdan gelenler */

.from-right {
    align-self: flex-end;
    padding-right: 4%;

    animation-name: fromRight;
}


/* Soldan gelenler */

.from-left {
    align-self: flex-start;
    padding-left: 4%;

    animation-name: fromLeft;
}


@keyframes fromRight {
    from {
        opacity: 0;
        transform: translateX(110vw);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}


@keyframes fromLeft {
    from {
        opacity: 0;
        transform: translateX(-110vw);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}


/* =========================================
   ANA KART
   ========================================= */

.card {
    position: relative;
    z-index: 5;

    width: calc(100% - 28px);
    max-width: 390px;

    padding: 32px 21px;

    text-align: center;

    background: rgba(255, 255, 255, 0.94);

    border: 1px solid rgba(84, 119, 89, .18);

    border-radius: 25px;

    box-shadow:
        0 20px 60px rgba(57, 83, 61, .17);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    animation: cardIn .7s ease;
}


@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


.hidden {
    display: none !important;
}


/* =========================================
   ŞİFRE
   ========================================= */

h1 {
    margin: 0 0 23px;

    color: #527659;

    font-size: 30px;
    font-weight: 650;

    letter-spacing: -.5px;
}


input {
    width: 100%;
    height: 52px;

    border-radius: 14px;

    border: 1px solid #b9cfba;

    outline: none;

    background: #f8fbf8;

    color: #38523d;

    text-align: center;

    font-size: 19px;

    letter-spacing: 6px;

    transition: .2s;
}


input:focus {
    border-color: #7fa885;

    box-shadow:
        0 0 0 4px rgba(127, 168, 133, .12);
}


input::placeholder {
    color: #a1b3a3;
    letter-spacing: 1px;
}


.error {
    min-height: 18px;

    margin-top: 8px;

    color: #729177;

    font-size: 13px;
}


/* =========================================
   SORU
   ========================================= */

.question {
    margin-bottom: 28px;

    color: #527659;

    font-size: 27px;
    line-height: 1.45;

    font-weight: 600;
}


/* =========================================
   BUTONLAR
   ========================================= */

.buttons {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 14px;

    height: 54px;
}


button {
    height: 50px;

    padding: 0 20px;

    border-radius: 14px;

    border: none;

    font-family: inherit;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}


.yes {
    position: relative;
    z-index: 10;

    background: #8fb894;

    color: white;

    box-shadow:
        0 8px 20px rgba(78, 116, 84, .16);

    transition: .2s;
}


.yes:hover {
    background: #80a985;
    transform: translateY(-2px);
}


/* =========================================
   HAYIR BUTONU

   Başlangıçta normal.
   Kaçınca fixed olur.
   Kaybolmaz.
   Yumuşak şekilde hareket eder.
   ========================================= */

.no {
    position: relative;
    z-index: 20;

    background: #edf5ed;

    color: #57725c;

    border: 1px solid #c1d7c3;

    transition:
        left .55s cubic-bezier(.22, .8, .2, 1),
        top .55s cubic-bezier(.22, .8, .2, 1),
        transform .55s cubic-bezier(.22, .8, .2, 1);
}


/* =========================================
   GIF
   ========================================= */

.gif-container {
    display: none;

    margin-top: 25px;

    animation: gifIn .7s ease;
}


.gif-container img {
    display: block;

    width: 100%;
    max-width: 290px;
    max-height: 290px;

    object-fit: contain;

    margin: auto;

    border-radius: 18px;

    box-shadow:
        0 15px 40px rgba(60, 88, 64, .18);
}


.love {
    margin-top: 16px;

    color: #527659;

    font-size: 18px;

    font-weight: 600;
}


@keyframes gifIn {
    from {
        opacity: 0;
        transform: scale(.92) translateY(10px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}


/* =========================================
   TELEFON
   ========================================= */

@media (max-width: 420px) {

    .card {
        width: calc(100% - 22px);
        padding: 29px 18px;
    }

    h1 {
        font-size: 28px;
    }

    .question {
        font-size: 25px;
    }

    button {
        padding: 0 17px;
        font-size: 13px;
    }

    .line {
        font-size: 14px;
        gap: 0;
    }

    .poem {
        gap: 18px;
    }
}


@media (max-height: 650px) {

    .card {
        padding-top: 24px;
        padding-bottom: 24px;
    }

    .poem {
        gap: 10px;
    }

    .line {
        font-size: 13px;
    }
}

</style>
</head>


<body>


<!-- =========================================
     ARKA PLAN ŞİİRİ
     ========================================= -->

<div class="poem">

    <div class="line from-left" style="animation-delay:.2s">
        Ellerimde değil artık, aklımda kalan izin,
    </div>

    <div class="line from-right" style="animation-delay:.7s">
        Sessizce büyür her gece, saygım ve sevgim
    </div>

    <div class="line from-left" style="animation-delay:1.2s">
        İçimde büyüyen şeyin adını koymadım
    </div>

    <div class="line from-right" style="animation-delay:1.7s">
        Lüzum yok bazı şeylere sen anlatmadan anladım
    </div>

    <div class="line from-left" style="animation-delay:2.2s">
        Adını anmadım ama bilesin sen birtanesin.
    </div>

</div>


<!-- =========================================
     ŞİFRE EKRANI
     ========================================= -->

<div class="card" id="passwordScreen">

    <h1>Esila'm</h1>

    <input
        id="password"
        type="password"
        inputmode="numeric"
        maxlength="6"
        autocomplete="off"
        placeholder="Şifre"
    >

    <div class="error" id="error"></div>

</div>


<!-- =========================================
     BARIŞMA EKRANI
     ========================================= -->

<div class="card hidden" id="questionScreen">

    <div class="question">
        Özür dilerim yavrum 🥺<br>
        Barışalımmı?
    </div>


    <div class="buttons">

        <button
            class="yes"
            id="yesButton"
            onclick="yesClicked()"
        >
            EVETTTTT 💚
        </button>


        <button
            class="no"
            id="noButton"
        >
            HAYIR !
        </button>

    </div>


    <div
        class="gif-container"
        id="gifContainer"
    >

        <img
            src="kedi.gif"
            alt="Kedi"
        >

        <div class="love">
            Biliyordum yavrum barışacağımızı.
        </div>

    </div>

</div>


<script>


/* =========================================
   ŞİFRE

   160826 yazıldığı anda geçer.
   ========================================= */

const password =
    document.getElementById("password");

const passwordScreen =
    document.getElementById("passwordScreen");

const questionScreen =
    document.getElementById("questionScreen");

const error =
    document.getElementById("error");


password.addEventListener("input", function() {

    if (this.value === "160826") {

        passwordScreen.classList.add("hidden");

        questionScreen.classList.remove("hidden");

    }

    else if (this.value.length === 6) {

        error.textContent =
            "Şifre yanlış 🥺";

        setTimeout(() => {
            error.textContent = "";
        }, 1400);

    }

});


/* =========================================
   KAÇAN HAYIR BUTONU
   ========================================= */

const noButton =
    document.getElementById("noButton");


let escaped = false;


/*
   Masaüstünde fare butona gerçekten
   yaklaştığında kaçıyor.
*/

noButton.addEventListener("mouseenter", function() {

    escapeButton();

});


/*
   Telefonda dokunulduğunda kaçıyor.
   Ama buton yok olmuyor.
*/

noButton.addEventListener("touchstart", function(e) {

    e.preventDefault();

    escapeButton();

}, { passive: false });


function escapeButton() {

    const buttonWidth =
        noButton.offsetWidth;

    const buttonHeight =
        noButton.offsetHeight;


    /*
       İlk hareketten önce mevcut
       konumunu koruyoruz.
    */

    if (!escaped) {

        const rect =
            noButton.getBoundingClientRect();

        noButton.style.position = "fixed";

        noButton.style.left =
            rect.left + "px";

        noButton.style.top =
            rect.top + "px";

        escaped = true;

        /*
           Browser'ın ilk pozisyonu
           uygulaması için küçük gecikme.
        */

        requestAnimationFrame(() => {
            moveButton(buttonWidth, buttonHeight);
        });

    }

    else {

        moveButton(buttonWidth, buttonHeight);

    }

}


function moveButton(width, height) {

    const padding = 18;

    const maxX =
        window.innerWidth -
        width -
        padding;

    const maxY =
        window.innerHeight -
        height -
        padding;


    /*
       Kartın bulunduğu orta bölgeden
       uzak yerlere kaçmasını sağlıyoruz.
    */

    let x;
    let y;

    const side =
        Math.floor(Math.random() * 4);


    if (side === 0) {

        // SOL

        x =
            padding +
            Math.random() * 75;

        y =
            70 +
            Math.random() * Math.max(50, maxY - 140);

    }

    else if (side === 1) {

        // SAĞ

        x =
            maxX -
            Math.random() * 75;

        y =
            70 +
            Math.random() * Math.max(50, maxY - 140);

    }

    else if (side === 2) {

        // ÜST

        x =
            padding +
            Math.random() * Math.max(50, maxX - 50);

        y =
            padding +
            Math.random() * 80;

    }

    else {

        // ALT

        x =
            padding +
            Math.random() * Math.max(50, maxX - 50);

        y =
            maxY -
            Math.random() * 80;

    }


    x = Math.max(
        padding,
        Math.min(x, maxX)
    );

    y = Math.max(
        padding,
        Math.min(y, maxY)
    );


    noButton.style.left =
        x + "px";

    noButton.style.top =
        y + "px";


    /*
       Çok hafif yön değişimi.
       Sert dönmüyor.
    */

    const rotation =
        Math.random() * 4 - 2;

    noButton.style.transform =
        `rotate(${rotation}deg)`;
}


/* =========================================
   EVET
   ========================================= */

function yesClicked() {

    noButton.style.display =
        "none";

    document
        .getElementById("gifContainer")
        .style.display = "block";

}

</script>

</body>
</html>
